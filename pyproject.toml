[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "palworld-save-studio"
description = "A modern Windows save editor for Palworld 1.0."
authors = [
    { name = "RayChen200318" },
]
keywords = ["palworld", "save-editor", "windows", "pal"]
license = {file = "LICENSE"}
requires-python = ">=3.11"
readme = "README.md"
version = "0.4.3b1"
dependencies = [
    "setuptools==80.9.0",
    "palworld-save-tools @ git+https://github.com/oMaN-Rod/palworld-save-tools.git@790e0bcf7bacef47b048e110066617a8fbb40041",
    "wheel==0.46.1",
    "Flask==3.1.2",
    "pyinstaller==6.17.0",
    "waitress==3.0.2",
    "Flask-JWT-Extended==4.7.1",
    "pywebview==4.4.1",
    "requests==2.32.5"
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English"
]

[project.urls]
Homepage = "https://github.com/RayChen200318/palworld-save-studio"
Documentation = "https://github.com/RayChen200318/palworld-save-studio#readme"
Repository = "https://github.com/RayChen200318/palworld-save-studio.git"
Issues = "https://github.com/RayChen200318/palworld-save-studio/issues"
Changelog = "https://github.com/RayChen200318/palworld-save-studio/releases"
