name: Release Windows beta

on:
  push:
    tags:
      - '0.*'
      - 'v0.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Build, test, and package
        shell: pwsh
        run: .\build_executable.ps1
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create $env:GITHUB_REF_NAME
          .\dist\Palworld-Save-Studio.exe
          .\dist\Palworld-Save-Studio.exe.sha256
          --verify-tag
          --generate-notes
          --title "Palworld Save Studio $env:GITHUB_REF_NAME"
